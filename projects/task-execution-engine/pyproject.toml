[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "task-execution-engine"
version = "0.2.0"
description = "Deterministic, authorized repository tasks with independent verification"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
task-engine = "task_execution_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
