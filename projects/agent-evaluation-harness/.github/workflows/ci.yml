name: deterministic-evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q --junitxml=.evaluation/tests.xml
      - run: python scripts/demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: .evaluation/
          include-hidden-files: true
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-evaluation-harness .
      - run: docker run --rm --network none agent-evaluation-harness
