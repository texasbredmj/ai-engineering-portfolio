[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-harness"
version = "0.1.0"
description = "Deterministic task and tool evaluation with independent evidence and regression gates"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "opentelemetry-sdk>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
agent-eval = "agent_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
