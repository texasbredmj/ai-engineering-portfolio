[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-failure-recovery-lab"
version = "0.1.0"
description = "Controlled HTTP and network fault injection with durable recovery evidence"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "prometheus-client>=0.21,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
recovery-lab = "recovery_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stack: requires the local Docker lab"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
